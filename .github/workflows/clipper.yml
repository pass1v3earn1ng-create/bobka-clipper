name: Нарезка клипов

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      vod:
        description: "Ссылка на эфир (twitch.tv/videos/...). Пусто — сам найдёт новые"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Где лежит проект
        run: |
          if [ -f clipper/__main__.py ]; then P=.; else
            P=$(dirname "$(dirname "$(find . -path ./.git -prune -o -type f -path '*/clipper/__main__.py' -print | head -n1)")")
          fi
          echo "PROJ=$GITHUB_WORKSPACE/${P#./}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Есть ли новые эфиры
        id: check
        working-directory: ${{ env.PROJ }}
        env:
          VOD: ${{ github.event.inputs.vod }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install --quiet --disable-pip-version-check --upgrade yt-dlp pyyaml requests
          python -m clipper check --vod "$VOD" --github-output "$GITHUB_OUTPUT"

      - name: Проверка связи с Telegram (только при ручном запуске)
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.PROJ }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m clipper test-telegram || true

      - name: Ставлю ffmpeg
        if: steps.check.outputs.todo != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Ставлю зависимости
        if: steps.check.outputs.todo != ''
        working-directory: ${{ env.PROJ }}
        run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Скачиваю TwitchDownloaderCLI (для чата)
        if: steps.check.outputs.todo != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tdl" && cd "$RUNNER_TEMP/tdl"
          gh release download --repo lay295/TwitchDownloader --pattern '*CLI-*-Linux-x64.zip' --clobber
          unzip -o -q ./*.zip
          BIN=$(find "$PWD" -type f -name TwitchDownloaderCLI | head -n1)
          chmod +x "$BIN"
          echo "TDL_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Кэш моделей речи
        if: steps.check.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJ }}/.models
          key: whisper-${{ hashFiles('**/config.yaml') }}
          restore-keys: whisper-

      - name: Режу клипы
        if: steps.check.outputs.todo != ''
        working-directory: ${{ env.PROJ }}
        env:
          TODO: ${{ steps.check.outputs.todo }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODELS_DIR: ${{ env.PROJ }}/.models
        run: python -m clipper run --vods "$TODO" --out clips

      - name: Клипы архивом (запасной вариант, хранится 5 дней)
        if: always() && steps.check.outputs.todo != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: ${{ env.PROJ }}/clips/
          retention-days: 5
          if-no-files-found: ignore

      - name: Запоминаю, что уже нарезано
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJ/state/processed.json" || exit 0
          if ! git diff --cached --quiet; then
            git commit -q -m "нарезка: ${{ steps.check.outputs.todo || 'проверка' }}"
            git pull -q --rebase origin "$GITHUB_REF_NAME" || true
            git push -q origin "HEAD:$GITHUB_REF_NAME"
          fi
