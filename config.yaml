# Настройки автонарезки. Меняй только значения справа от двоеточия.
# После правки нажми «Commit changes» — со следующего запуска всё подхватится.

# Ник канала на Twitch (как в ссылке twitch.tv/...)
channel: 1rlandectv

# Сколько клипов с эфира: только clips_max самых сильных моментов, лучшие первыми.
# Моменты, где кто-то написал в чат «клип», приходят всегда, сверх этого числа.
# 0 — без лимита (бот пришлёт всё, что посчитает годным; на спокойных эфирах это сотни клипов).
clips_max: 8
# Даже с тихого эфира придёт минимум clips_min
clips_min: 3

# Насколько строго отбирать: 1 — обычно, 1.5 — только самое жёсткое, 0.7 — всё подряд пожирнее
strictness: 1.0

# Длина клипа в секундах: обычно около clip_target_sec,
# но не короче clip_min_sec и не длиннее clip_max_sec
clip_target_sec: 22
clip_min_sec: 18
clip_max_sec: 30

# Язык эфира для субтитров: ru, en, pl ... или null — определять самому
language: ru

# Субтитры поверх клипа (то, что ты говоришь)
subtitles: true
# Вторая строка мельче — перевод на английский
english_line: true

# Подпись канала на клипе. Пусто ("") — без подписи
handle_text: "twitch.tv/1rlandectv"

# Раскладка вертикали:
#   auto    — нашёл лицо с вебки: вебка сверху, игра снизу; не нашёл — игра по центру на размытом фоне
#   cam_top — всегда вебка сверху (нужна рамка вебки, см. cam_box)
#   blur    — всегда игра по центру на размытом фоне
layout: auto

# Где на эфире вебка, если автопоиск промахнулся: [x, y, ширина, высота] в долях кадра от 0 до 1.
# Пример для вебки в левом нижнем углу: [0.0, 0.70, 0.25, 0.30]
cam_box: null

# Сколько секунд в начале и в конце эфира не трогать (заставка, «привет», рейд)
skip_start_sec: 120
skip_end_sec: 60

# Насколько чат отстаёт от того, что происходит на экране (секунды)
chat_delay_sec: 6

# Эфиры старше этого (в часах) не нарезаются
max_vod_age_hours: 48

# Частота кадров готового клипа
fps: 30

# Модели распознавания речи: быстрая — для поиска моментов, точная — для субтитров
whisper_fast: small
whisper_subs: medium

# Модель Claude для умного отбора (работает, только если добавлен секрет ANTHROPIC_API_KEY)
llm_model: claude-sonnet-5-5

# Дополнительно присылать копию без субтитров (для монтажа в CapCut)
send_clean_copy: false

# ---------------------------------------------------------------------------
# Чужие каналы: нарезки на заработок (кампании на Whop / Content Rewards).
# Клипы придут тем же ботом с пометкой «📎 чужой канал». Выкладывай их с отдельного аккаунта
# и строго по правилам кампании (теги, подпись, длина) — иначе не засчитают просмотры.
# Можно просто ник, а можно ник с настройками — любыми из тех, что выше. Пример:
#
# others:
#   - channel: ник_стримера          # как в ссылке twitch.tv/ник_стримера
#     language: en                   # язык стримера; не указан — бот определит сам
#     handle_text: "twitch.tv/ник_стримера"
#     clip_target_sec: 30            # если кампания просит другую длину
#     clip_max_sec: 45
#     clips_max: 10
#   - другой_ник
others: []
